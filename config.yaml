# AutoTube 설정 파일
work_dir: work
output_dir: output

video:
  format: shorts            # shorts(세로 1080x1920) | landscape(가로 1920x1080)
  fps: 30
  font_file: C:/Windows/Fonts/malgunbd.ttf   # 자막 폰트 (맑은 고딕 굵게)
  font_name: Malgun Gothic
  subtitle_size: 0          # 0 = 자동
  max_chars_per_line: 0     # 0 = 자동
  avatar_layout: auto       # auto(상품이미지 있으면 corner) | full | corner

tts:                        # 목소리
  engine: melotts           # melotts(추천) | espeak | dummy(테스트용)
  language: KR
  speaker: KR
  speed: 1.05               # 숏폼은 살짝 빠르게
  device: auto              # auto | cpu | cuda
  pause: 0.25               # 문장 사이 쉬는 시간(초)

avatar:                     # 인물
  engine: static            # sadtalker(입 움직임, GPU 권장) | static(사진+줌)
  sadtalker_dir: C:/ai/SadTalker
  sadtalker_python: C:/ai/SadTalker/venv/Scripts/python.exe
  extra_args: ["--still", "--preprocess", "full"]

music:
  dir: assets/music         # 이 폴더의 음악 중 랜덤 선택
  volume: 0.18
  ducking: true             # 말할 때 음악 자동으로 작게

youtube:
  client_secret: secrets/client_secret.json
  token: secrets/token.json
  default_privacy: private  # private | unlisted | public
  category_id: "22"         # 22=인물/블로그, 26=노하우/스타일
  synthetic_media: true     # AI 생성 인물/음성 사용 고지 (유튜브 정책)

watch:
  inbox: jobs/inbox
  interval: 30              # 초
  upload: true

llm:                        # (선택) 대본 자동 작성용 로컬 AI
  ollama_url: http://localhost:11434
  model: qwen2.5:7b
